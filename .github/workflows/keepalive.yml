name: Keepalive

# GitHub disables scheduled workflows after 60 days without repository activity.
# This job pushes a timestamp commit twice a month (max ~16 day gap) to reset that counter.

on:
  schedule:
    - cron: '0 3 1,15 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write timestamp
        run: date -u +'%Y-%m-%dT%H:%M:%SZ' > .github/last-activity.txt

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/last-activity.txt
          git commit -m "chore: keepalive timestamp [skip ci]"
          git push
